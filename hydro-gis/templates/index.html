<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HydroGIS</title>
  <style>
    :root { --nav:#18324a; --accent:#1769aa; --bg:#eef3f8; }
    body { margin:0; font-family:Segoe UI,Arial,sans-serif; background:var(--bg); color:#26384a; }
    header { height:58px; background:var(--nav); color:white; display:flex; align-items:center;
      justify-content:space-between; padding:0 18px; }
    header a { color:white; text-decoration:none; margin-left:14px; }
    main { height:calc(100vh - 58px); display:grid; grid-template-columns:280px 1fr; }
    aside { background:white; padding:16px; overflow:auto; border-right:1px solid #d9e3ed; }
    aside select,aside input,aside button { width:100%; box-sizing:border-box; padding:9px;
      margin:5px 0 10px; border:1px solid #ccd8e5; border-radius:8px; }
    aside button { background:var(--accent); color:white; border:0; cursor:pointer; }
    .station { padding:9px; border-radius:8px; cursor:pointer; }
    .station:hover,.station.active { background:#eaf2f9; }
    .thumb-grid { display:grid; gap:8px; }
    .thumb-card { position:relative; border:1px solid #d9e3ed; border-radius:8px;
      overflow:hidden; background:#fff; }
    .thumb-card img { width:100%; display:block; cursor:pointer; background:white; }
    .thumb-card.expanded { grid-column:1/-1; }
    .thumb-card.expanded img { max-height:360px; object-fit:contain; }
    .thumb-title { padding:6px 8px; font-size:12px; font-weight:600; }
    .thumb-actions { display:flex; gap:6px; padding:0 8px 8px; }
    .thumb-actions a { flex:1; text-align:center; text-decoration:none; font-size:12px;
      color:#1769aa; background:#edf4fa; border-radius:6px; padding:5px; }
    #mapFrame { width:100%; height:46%; border:0; background:white; }
    #chartFrame { width:100%; height:54%; border:0; background:white; }
  </style>
</head>
<body>
  <header>
    <strong>HydroGIS</strong>
    <div>{{ username }}{% if is_admin %}<a href="/admin">Администрирование</a>{% endif %}<a href="/logout">Выход</a></div>
  </header>
  <main>
    <aside>
      <label>Обзор карты</label>
      <select id="overview">
        <option value="all">Вся система</option>
        <option value="volga">Волга</option>
        <option value="kama">Кама</option>
      </select>
      <label>Поиск объекта</label>
      <input id="search" placeholder="Название">
      <label>Параметр графика</label>
      <select id="parameter">
        <option value="discharge">Расход воды</option>
        <option value="level_upper">Верхний бьеф</option>
        <option value="level_lower">Нижний бьеф</option>
        <option value="level">Уровень на гидропосте</option>
      </select>
      <label>С даты</label><input id="dateFrom" type="date" value="2010-01-01">
      <label>По дату</label><input id="dateTo" type="date">
      <button id="showChart">Построить график</button>
      <h3>Мини-графики</h3>
      <div id="thumbGrid" class="thumb-grid"></div>
      <h3>Объекты</h3>
      <div id="stations">
        {% for s in stations %}
        <div class="station" data-id="{{ s.station_id }}" data-river="{{ s.river }}"
             data-name="{{ s.display_name }}" data-type="{{ s.object_type }}">
          {{ s.display_name }}
        </div>
        {% endfor %}
      </div>
    </aside>
    <section>
      <iframe id="mapFrame" src="/map"></iframe>
      <iframe id="chartFrame" src="about:blank"></iframe>
    </section>
  </main>
  <script>
    let selected = null;
    const stations = document.querySelectorAll(".station");
    const thumbParameters = [
      ["discharge", "Расход воды"],
      ["level_upper", "Верхний бьеф"],
      ["level_lower", "Нижний бьеф"],
      ["level", "Уровень"]
    ];
    function chartParams(parameter) {
      return new URLSearchParams({
        station: selected,
        parameter: parameter,
        from: document.getElementById("dateFrom").value,
        to: document.getElementById("dateTo").value
      });
    }
    function updateThumbnails() {
      const grid = document.getElementById("thumbGrid");
      grid.innerHTML = "";
      if (!selected) return;
      thumbParameters.forEach(function(item) {
        const params = chartParams(item[0]);
        const url = "/plot?" + params.toString();
        const card = document.createElement("div");
        card.className = "thumb-card";
        card.innerHTML =
          '<div class="thumb-title">' + item[1] + '</div>' +
          '<img alt="' + item[1] + '" src="' + url + '">' +
          '<div class="thumb-actions">' +
          '<a class="expand" href="#">Развернуть</a>' +
          '<a href="' + url + '&download=1">Скачать PNG</a>' +
          '</div>';
        card.querySelector("img").addEventListener("click", function() {
          card.querySelector(".expand").click();
        });
        card.querySelector(".expand").addEventListener("click", function(event) {
          event.preventDefault();
          const wasExpanded = card.classList.contains("expanded");
          document.querySelectorAll(".thumb-card").forEach(c => c.classList.remove("expanded"));
          if (!wasExpanded) {
            card.classList.add("expanded");
            document.getElementById("chartFrame").src = url;
          } else {
            document.getElementById("chartFrame").src = "about:blank";
          }
        });
        grid.appendChild(card);
      });
    }
    function updateMap() {
      const overview = document.getElementById("overview").value;
      document.getElementById("mapFrame").src =
        "/map?overview=" + encodeURIComponent(overview) +
        (selected ? "&station=" + encodeURIComponent(selected) : "");
    }
    stations.forEach(function(el) {
      el.addEventListener("click", function() {
        stations.forEach(s => s.classList.remove("active"));
        el.classList.add("active");
        selected = el.dataset.id;
        updateMap();
        updateThumbnails();
      });
    });
    document.getElementById("overview").addEventListener("change", updateMap);
    document.getElementById("search").addEventListener("input", function() {
      const text = this.value.toLowerCase();
      stations.forEach(el => el.style.display =
        el.dataset.name.toLowerCase().includes(text) ? "block" : "none");
    });
    document.getElementById("showChart").addEventListener("click", function() {
      if (!selected) { alert("Выберите объект из списка"); return; }
      const params = chartParams(document.getElementById("parameter").value);
      document.getElementById("chartFrame").src = "/plot?" + params.toString();
      updateThumbnails();
    });
    document.getElementById("dateFrom").addEventListener("change", updateThumbnails);
    document.getElementById("dateTo").addEventListener("change", updateThumbnails);
  </script>
</body>
</html>
