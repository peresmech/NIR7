<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/vendor/leaflet.css">
  <style>
    html,body,#map { width:100%;height:100%;margin:0;background-color:#e7edf0; }
    .leaflet-popup-content { line-height:1.55; }
    .leaflet-control-attribution { font-size:10px; }
    .basemap-notice { background:rgba(255,255,255,.95); padding:7px 10px;
      border:1px solid #d6a5a5; border-radius:6px; color:#8d2828;
      font:12px Segoe UI,Arial,sans-serif; box-shadow:0 2px 8px #0002; }
    #basemapStatus { position:absolute; z-index:600; top:12px; left:50%;
      transform:translateX(-50%); }
    #mapStatus { position:absolute; z-index:600; left:50%; top:50%; transform:translate(-50%,-50%);
      max-width:390px; padding:14px 18px; border:1px solid #b9c9d3; border-radius:9px;
      background:#fffffff5; color:#30495a; box-shadow:0 3px 14px #18324a2b;
      font:14px Segoe UI,Arial,sans-serif; text-align:center; }
    #mapStatus.error { border-color:#d6a5a5; color:#8d2828; }
    #pickStatus { position:absolute; z-index:600; left:50%; top:12px; transform:translateX(-50%);
      max-width:90%; padding:8px 12px; border:1px solid #b9c9d3; border-radius:8px;
      background:#fffffff5; color:#30495a; font:13px Segoe UI,Arial,sans-serif;
      text-align:center; }
  </style>
  <script src="/static/vendor/leaflet.js" onerror="window.hydroLeafletFailed=true"></script>
</head>
<body>
  <div id="map" aria-label="Карта гидрологических объектов"></div>
  <div id="mapStatus" role="status">Загружаем OpenStreetMap и объекты…</div>
  <div id="pickStatus" role="status" hidden>Нажмите на карте, чтобы выбрать место.</div>
  <div id="basemapStatus" class="basemap-notice" role="status" hidden>
    Подложка OpenStreetMap недоступна. Проверьте подключение к интернету.
  </div>
  <script>
    const mapStatus = document.getElementById("mapStatus");
    const basemapStatus = document.getElementById("basemapStatus");
    if (!window.L || window.hydroLeafletFailed) {
      mapStatus.textContent = "Не загрузилась библиотека карты. Проверьте папку static/vendor рядом с приложением.";
      mapStatus.classList.add("error");
      throw new Error("Local Leaflet assets failed to load");
    }
    const stations = {{ stations|tojson }};
    const selectedStation = {{ selected_station|tojson }};
    const pickMode = {{ pick_mode|tojson }};
    const canEdit = {{ can_edit|tojson }};
    const map = L.map("map", {
      zoomControl:true,
      attributionControl:false
    }).setView({{ center|tojson }}, 5);
    window.hydroInvalidateSize = () => map.invalidateSize();
    const basemap = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    });
    let basemapRequestFailed = false;
    basemap.on("loading", () => {
      basemapRequestFailed = false;
      basemapStatus.hidden = true;
    });
    basemap.on("tileerror", () => { basemapRequestFailed = true; });
    basemap.on("load", () => {
      basemapStatus.hidden = !basemapRequestFailed;
    });
    basemap.addTo(map);
    const bounds = L.latLngBounds([]);
    if (pickMode) {
      document.getElementById("pickStatus").hidden = false;
      document.getElementById("map").style.cursor = "crosshair";
      map.on("click", event => {
        const {lat, lng} = event.latlng;
        const latitude = Number(lat.toFixed(6));
        const longitude = Number(lng.toFixed(6));
        document.getElementById("pickStatus").textContent =
          "Широта: " + latitude.toFixed(6) + " · Долгота: " + longitude.toFixed(6) +
          " — место выбрано";
        if (window.hydroPickMarker) window.hydroPickMarker.remove();
        window.hydroPickMarker = L.circleMarker([latitude, longitude], {
          radius:8, color:"#e67e22", fillColor:"#e67e22", fillOpacity:1, weight:2
        }).addTo(map);
        window.parent.postMessage({
          type:"hydroLocationSelected", lat:latitude, lon:longitude
        },"*");
      });
    }
    addStations();
    mapStatus.hidden = true;

    function addStations() {
    stations.forEach(function(station) {
      const selected = station.station_id === selectedStation;
      const kind = station.object_type === "hub" ? "Гидроузел" : "Гидропост";
      const marker = L.circleMarker([station.lat,station.lon], {
        radius:selected ? 9 : 6,
        color:selected ? "#e67e22" : "#1976d2",
        fillColor:selected ? "#e67e22" : "#1976d2",
        fillOpacity:.9,
        weight:2
      }).addTo(map);
      marker.bindTooltip(station.display_name, {
        permanent:selected,
        direction:"top",
        offset:[0,-5]
      });
      const popup = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = station.display_name;
      popup.append(title,document.createElement("br"));
      popup.append(document.createTextNode(kind + " · " + station.river));
      if (station.source_istok) {
        popup.append(document.createElement("br"));
        popup.append(document.createTextNode("ИСТОК: " + station.source_istok));
      }
      if (station.tp) {
        popup.append(document.createElement("br"));
        popup.append(document.createTextNode("ТП: " + station.tp));
      }
      marker.bindPopup(popup);
      marker.on("click",function() {
        if (pickMode) return;
        window.parent.postMessage({
          type:"hydroStationSelected",
          stationId:station.station_id
        },"*");
      });
      if (canEdit) {
        marker.on("contextmenu", function() {
          window.parent.postMessage({
            type:"hydroStationEdit",
            stationId:station.station_id
          },"*");
        });
      }
      bounds.extend([station.lat,station.lon]);
    });
    const focusedStation = stations.find(station => station.station_id === selectedStation);
    if (focusedStation) {
      map.setView([focusedStation.lat,focusedStation.lon],7);
    } else if (bounds.isValid()) {
      map.fitBounds(bounds,{padding:[36,36],maxZoom:8});
    }
    requestAnimationFrame(() => map.invalidateSize());
    setTimeout(() => map.invalidateSize(),150);
    }

    L.control.attribution({prefix:false})
      .addAttribution("&copy; OpenStreetMap contributors")
      .addTo(map);
  </script>
</body>
</html>
