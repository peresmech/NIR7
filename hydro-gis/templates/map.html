<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/vendor/leaflet.css">
  <style>
    html,body,#map { width:100%;height:100%;margin:0;background-color:#e7edf0; }
    #map { background-image:linear-gradient(#aab8bf24 1px,transparent 1px),
      linear-gradient(90deg,#aab8bf24 1px,transparent 1px);background-size:96px 96px; }
    .leaflet-popup-content { line-height:1.55; }
    .leaflet-control-attribution { font-size:10px; }
    .map-legend { background:rgba(255,255,255,.95); padding:9px 12px;
      border:1px solid #c8d6d3; border-radius:8px; color:#344c49;
      font:12px Segoe UI,Arial,sans-serif; box-shadow:0 2px 8px #0002; }
    .legend-title { font-weight:700; margin-bottom:4px; }
    .legend-item { white-space:nowrap; margin-top:3px; }
    .legend-line { display:inline-block; width:19px; border-top:3px solid #258c9b;
      margin:0 5px 3px 0; }
    .legend-water { display:inline-block; width:12px; height:8px;
      margin:0 8px 0 3px; border:1px solid #639bb1; background:#9bcde0; }
    .leaflet-div-icon.river-name-icon { border:0; background:transparent; }
    .river-name-icon span { padding:2px 6px; border:1px solid #b6d2dc; border-radius:5px;
      background:#fffffff0; color:#145165; font:700 12px Segoe UI,Arial,sans-serif;
      white-space:nowrap; box-shadow:0 1px 5px #18324a22; }
    .legend-point { display:inline-block; width:9px; height:9px; border-radius:50%;
      background:#1769aa; margin:0 10px 0 5px; }
    .local-notice { background:rgba(255,255,255,.92); padding:4px 7px;
      border-radius:5px; color:#526662; font:10px Segoe UI,Arial,sans-serif; }
    .basemap-notice { background:rgba(255,255,255,.95); padding:7px 10px;
      border:1px solid #d6a5a5; border-radius:6px; color:#8d2828;
      font:12px Segoe UI,Arial,sans-serif; box-shadow:0 2px 8px #0002; }
    #basemapStatus { position:absolute; z-index:600; top:12px; left:50%;
      transform:translateX(-50%); }
    #mapStatus { position:absolute; z-index:600; left:50%; top:50%; transform:translate(-50%,-50%);
      max-width:390px; padding:14px 18px; border:1px solid #b9c9d3; border-radius:9px;
      background:#fffffff5; color:#30495a; box-shadow:0 3px 14px #18324a2b;
      font:14px Segoe UI,Arial,sans-serif; text-align:center; }
    #mapStatus.error { border-color:#d6a5a5; color:#8d2828; }
  </style>
  <script src="/static/vendor/leaflet.js" onerror="window.hydroLeafletFailed=true"></script>
</head>
<body>
  <div id="map" aria-label="Карта гидрологических объектов"></div>
  <div id="mapStatus" role="status">Загружаем локальные реки, водоёмы и гидрообъекты…</div>
  <div id="basemapStatus" class="basemap-notice" role="status" hidden>
    Подложка OpenStreetMap недоступна. Проверьте подключение к интернету.
  </div>
  <script>
    const mapStatus = document.getElementById("mapStatus");
    const basemapStatus = document.getElementById("basemapStatus");
    if (!window.L || window.hydroLeafletFailed) {
      mapStatus.textContent = "Не загрузилась библиотека офлайн-карты. Проверьте папку static/vendor рядом с приложением.";
      mapStatus.classList.add("error");
      throw new Error("Local Leaflet assets failed to load");
    }
    const stations = {{ stations|tojson }};
    const selectedStation = {{ selected_station|tojson }};
    const overview = {{ overview|tojson }};
    const map = L.map("map", {
      zoomControl:true,
      attributionControl:false
    }).setView({{ center|tojson }}, 5);
    const basemap = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    });
    let basemapRequestFailed = false;
    basemap.on("loading", () => {
      basemapRequestFailed = false;
      basemapStatus.hidden = true;
    });
    basemap.on("tileerror", () => { basemapRequestFailed = true; });
    basemap.on("load", () => {
      basemapStatus.hidden = !basemapRequestFailed;
    });
    basemap.addTo(map);
    const bounds = L.latLngBounds([]);
    map.createPane("riverNetwork");
    map.getPane("riverNetwork").style.zIndex = 350;
    map.createPane("waterBodies");
    map.getPane("waterBodies").style.zIndex = 320;
    fetch("/map/data?overview=" + encodeURIComponent(overview))
      .then(response => {
        if (!response.ok) throw new Error("Не удалось загрузить локальные речные линии (" + response.status + ")");
        return response.json();
      })
      .then(data => {
        if (!data.features || !data.features.length) {
          throw new Error("Локальная речная сеть не содержит объектов");
        }
        const riverLayer = L.geoJSON(data, {
          pane:"riverNetwork",
          style:feature => ({
            color:feature.properties && feature.properties.kind &&
              feature.properties.kind.toLowerCase().includes("главн") ? "#087f91" : "#56a8ad",
            weight:feature.properties && feature.properties.kind &&
              feature.properties.kind.toLowerCase().includes("главн") ? 4 : 2,
            opacity:.95
          }),
          onEachFeature:(feature,layer) => {
            const props = feature.properties || {};
            if (props.river) {
              const label = props.river + (props.kind ? " · " + props.kind : "");
              layer.bindTooltip(label);
              const riverName = {volga:"Волга",kama:"Кама"}[props.id];
              if (riverName) {
                const labelIcon = L.divIcon({
                  className:"river-name-icon",
                  html:"<span>" + riverName + "</span>",
                  iconSize:[70,22],
                  iconAnchor:[35,11]
                });
                L.marker(layer.getBounds().getCenter(), {
                  icon:labelIcon,
                  interactive:false,
                  keyboard:false
                }).addTo(map);
              }
            }
          }
        }).addTo(map);
        if (riverLayer.getBounds().isValid()) bounds.extend(riverLayer.getBounds());
        addStations();
        mapStatus.hidden = true;
      })
      .catch(error => {
        console.error(error);
        addStations();
        mapStatus.textContent =
          "Не удалось загрузить локальные речные линии. Отображены только гидрообъекты.";
        mapStatus.classList.add("error");
      });

    if (overview !== "kama") {
      fetch("/map/water?overview=" + encodeURIComponent(overview))
        .then(response => {
          if (!response.ok) throw new Error("Не удалось загрузить слой водоёмов");
          return response.json();
        })
        .then(data => {
          if (!data.features || !data.features.length) return;
          L.geoJSON(data, {
            pane:"waterBodies",
            style: {
              color:"#6295aa",
              weight:1.4,
              opacity:.75,
              fillColor:"#78b9d5",
              fillOpacity:.78
            },
            onEachFeature:(feature,layer) => {
              const name = feature.properties && feature.properties.name;
              if (name) layer.bindTooltip(name);
            }
          }).addTo(map);
        })
        .catch(error => console.error(error));
    }

    function addStations() {
    stations.forEach(function(station) {
      const selected = station.station_id === selectedStation;
      const kind = station.object_type === "hub" ? "Гидроузел" : "Гидропост";
      const marker = L.circleMarker([station.lat,station.lon], {
        radius:selected ? 9 : 6,
        color:selected ? "#e67e22" : "#1976d2",
        fillColor:selected ? "#e67e22" : "#1976d2",
        fillOpacity:.9,
        weight:2
      }).addTo(map);
      marker.bindTooltip(station.display_name, {
        permanent:selected,
        direction:"top",
        offset:[0,-5]
      });
      const popup = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = station.display_name;
      popup.append(title,document.createElement("br"));
      popup.append(document.createTextNode(kind + " · " + station.river));
      if (station.source_istok) {
        popup.append(document.createElement("br"));
        popup.append(document.createTextNode("ИСТОК: " + station.source_istok));
      }
      if (station.tp) {
        popup.append(document.createElement("br"));
        popup.append(document.createTextNode("ТП: " + station.tp));
      }
      marker.bindPopup(popup);
      marker.on("click",function() {
        window.parent.postMessage({
          type:"hydroStationSelected",
          stationId:station.station_id
        },"*");
      });
      bounds.extend([station.lat,station.lon]);
    });
    const focusedStation = stations.find(station => station.station_id === selectedStation);
    if (focusedStation) {
      map.setView([focusedStation.lat,focusedStation.lon],7);
    } else if (bounds.isValid()) {
      map.fitBounds(bounds,{padding:[36,36],maxZoom:8});
    }
    requestAnimationFrame(() => map.invalidateSize());
    setTimeout(() => map.invalidateSize(),150);
    }

    const legend = L.control({position:"topright"});
    legend.onAdd = function() {
      const box = L.DomUtil.create("div","map-legend");
      box.innerHTML = '<div class="legend-title">Локальная гидросеть</div>' +
        '<div class="legend-item"><i class="legend-water"></i>водохранилища</div>' +
        '<div class="legend-item"><i class="legend-line"></i>реки и водотоки</div>' +
        '<div class="legend-item"><i class="legend-point"></i>гидропост / гидроузел</div>';
      L.DomEvent.disableClickPropagation(box);
      return box;
    };
    legend.addTo(map);
    const notice = L.control({position:"bottomleft"});
    notice.onAdd = () => {
      const box = L.DomUtil.create("div","local-notice");
      box.textContent = "Гидросеть загружается локально · подложка требует интернет";
      return box;
    };
    notice.addTo(map);
    L.control.scale({metric:true,imperial:false}).addTo(map);
    L.control.attribution({prefix:false})
      .addAttribution("Русловые данные: © OpenStreetMap contributors (ODbL)")
      .addTo(map);
  </script>
</body>
</html>
